<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect x="0" y="13" width="1000" height="2" rx="1" fill="url(#line)"/>

  <!-- travelling spark -->
  <circle r="6" cy="14" fill="#c4b5fd" filter="url(#glow)">
    <animate attributeName="cx" values="120;880;120" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>
  <circle r="2.5" cy="14" fill="#ffffff">
    <animate attributeName="cx" values="120;880;120" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </circle>

  <!-- centre diamond -->
  <rect x="496" y="10" width="8" height="8" fill="#a78bfa" transform="rotate(45 500 14)">
    <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
