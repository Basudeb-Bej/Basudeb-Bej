<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">Basudeb Bej, Full-Stack Developer</title>
  <desc id="bd">Animated banner with a code window describing Basudeb Bej, a full-stack developer from West Bengal, India, open to opportunities.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#140b33"/>
      <stop offset="1" stop-color="#0b1a3a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round">
      <rect width="1000" height="280" rx="18"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace; font-size: 13px; }
    .line { opacity: 0; animation: reveal 0.5s ease-out forwards; }
    .l1 { animation-delay: 0.4s; } .l2 { animation-delay: 0.9s; } .l3 { animation-delay: 1.4s; }
    .l4 { animation-delay: 1.9s; } .l5 { animation-delay: 2.4s; } .l6 { animation-delay: 2.9s; } .l7 { animation-delay: 3.4s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 80px 59px; }
    .rise { opacity: 0; animation: rise 0.8s ease-out forwards; }
    .r1 { animation-delay: 0.1s; } .r2 { animation-delay: 0.3s; } .r3 { animation-delay: 0.5s; } .r4 { animation-delay: 0.7s; }
    @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: 0.35; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- floating glow orbs -->
    <g filter="url(#blur)">
      <circle cx="170" cy="60" r="90" fill="#7c3aed" opacity="0.5">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 24; 0 0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="860" cy="250" r="110" fill="#06b6d4" opacity="0.32">
        <animateTransform attributeName="transform" type="translate" values="0 0; -50 -20; 0 0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="280" r="80" fill="#ec4899" opacity="0.2">
        <animateTransform attributeName="transform" type="translate" values="0 0; 30 -18; 0 0" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- left column -->
    <g class="sans">
      <g class="rise r1">
        <rect x="60" y="40" width="254" height="30" rx="15" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.55"/>
        <circle cx="80" cy="55" r="4" fill="#22c55e" class="pulse" style="transform-origin: 80px 55px;"/>
        <circle cx="80" cy="55" r="4" fill="#22c55e"/>
        <text x="94" y="59" font-size="11" font-weight="700" letter-spacing="1.6" fill="#86efac">OPEN TO OPPORTUNITIES</text>
      </g>

      <text class="rise r2" x="58" y="132" font-size="58" font-weight="800" fill="url(#name)">Basudeb Bej</text>
      <text class="rise r3" x="60" y="168" font-size="24" font-weight="500" fill="#e2e8f0">Full-Stack Developer</text>
      <text class="rise r3" x="60" y="198" font-size="15" fill="#94a3b8">I build fast, secure and AI-powered web applications.</text>

      <g class="rise r4" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">
        <rect x="60" y="220" width="72" height="26" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="96" y="237">React</text>
        <rect x="142" y="220" width="84" height="26" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="184" y="237">Node.js</text>
        <rect x="236" y="220" width="94" height="26" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="283" y="237">MongoDB</text>
        <rect x="340" y="220" width="96" height="26" rx="13" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="388" y="237">AI / RAG</text>
      </g>
    </g>

    <!-- code window -->
    <g>
      <rect x="560" y="34" width="390" height="212" rx="12" fill="#0d1117" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="560" y="34" width="390" height="30" rx="12" fill="#ffffff" fill-opacity="0.05"/>
      <circle cx="582" cy="49" r="5" fill="#ff5f56"/>
      <circle cx="600" cy="49" r="5" fill="#ffbd2e"/>
      <circle cx="618" cy="49" r="5" fill="#27c93f"/>
      <text x="640" y="53" class="sans" font-size="11" fill="#8b949e">profile.js</text>

      <g class="mono">
        <text class="line l1" x="580" y="92"><tspan fill="#c792ea">const</tspan> <tspan fill="#82aaff">basudeb</tspan> <tspan fill="#89ddff">=</tspan> <tspan fill="#e2e8f0">{</tspan></text>
        <text class="line l2" x="602" y="114"><tspan fill="#7fdbca">role</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#ecc48d">"Full-Stack Developer"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text class="line l3" x="602" y="136"><tspan fill="#7fdbca">stack</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#e2e8f0">[</tspan><tspan fill="#ecc48d">"React"</tspan><tspan fill="#e2e8f0">,</tspan> <tspan fill="#ecc48d">"Node"</tspan><tspan fill="#e2e8f0">,</tspan> <tspan fill="#ecc48d">"MongoDB"</tspan><tspan fill="#e2e8f0">],</tspan></text>
        <text class="line l4" x="602" y="158"><tspan fill="#7fdbca">focus</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#ecc48d">"AI-powered web apps"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text class="line l5" x="602" y="180"><tspan fill="#7fdbca">location</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#ecc48d">"West Bengal, India"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text class="line l6" x="602" y="202"><tspan fill="#7fdbca">openToWork</tspan><tspan fill="#e2e8f0">:</tspan> <tspan fill="#f78c6c">true</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text class="line l7" x="580" y="224"><tspan fill="#e2e8f0">};</tspan></text>
        <rect class="cursor" x="604" y="212" width="8" height="15" fill="#a78bfa"/>
      </g>
    </g>

    <!-- bottom accent bar -->
    <rect x="0" y="276" width="1000" height="4" fill="url(#bar)"/>
  </g>
</svg>
